services:
  - type: web
    name: academic-planner-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: academic-planner-db
          property: connectionString

  - type: web
    name: academic-planner
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://academic-planner-api-47y7.onrender.com/api

databases:
  - name: academic-planner-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
